<script>
(function () {
  var box = document.getElementById('consent'), priv = document.getElementById('privacy');
  var saved = null; try { saved = localStorage.getItem('consent'); } catch (e) {}
  if (!saved && needsConsent) box.hidden = false;
  function choose(v) { setConsent(v); box.hidden = true; }
  document.getElementById('consent-yes').onclick = function () { choose('granted'); };
  document.getElementById('consent-no').onclick = function () { choose('denied'); };
  function openPriv() { priv.open = true; }
  document.getElementById('privacy-link').addEventListener('click', function (e) {
    if (priv.open) { e.preventDefault(); priv.open = false; } else openPriv();
  });
  document.querySelector('[data-open-privacy]').addEventListener('click', openPriv);
  document.getElementById('consent-reset').addEventListener('click', function (e) {
    e.preventDefault();
    try { localStorage.removeItem('consent'); } catch (err) {}
    box.hidden = false;
  });
})();
</script>
